<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/socket.io/socket.io.js"></script>
<style>
body{margin:0;background:#0b141a;color:white;font-family:sans-serif}
.box{max-width:400px;margin:15px auto;background:#202c33;padding:20px;border-radius:15px;text-align:center}
input{width:85%;padding:12px;margin:7px;border-radius:10px;border:none;background:#2a3942;color:white}
button{padding:12px 20px;border-radius:25px;border:none;font-weight:bold;cursor:pointer;margin:5px}
.btn-green{background:#25D366;color:white;width:90%}
.btn-call{background:#25D366;color:white;padding:15px 40px;font-size:18px;border-radius:30px}
.btn-end{background:#f15c6d;color:white;padding:15px 40px;font-size:18px;border-radius:30px}
video{width:48%;height:210px;background:#000;border-radius:15px;object-fit:cover}
#chatBox{height:250px;overflow-y:auto;background:#111b21;margin:10px;border-radius:10px;padding:10px;text-align:left}
.msg{background:#005c4b;padding:8px 12px;margin:5px;border-radius:10px;display:inline-block;max-width:80%;clear:both}
#incoming{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:999;flex-direction:column;justify-content:center;align-items:center}
#mainApp{display:none}
</style>
</head>
<body>

<!-- LOGIN WITH OTP -->
<div id="loginBox" class="box">
<h2 style="color:#25D366">Wajid App Login</h2>
<input id="userName" placeholder="Apna Naam likho">
<input id="userEmail" placeholder="Gmail - abc@gmail.com">
<input id="userPhone" placeholder="Phone +92300...">
<button class="btn-green" onclick="sendOTP()">6 Digit OTP Bhejo</button>
<p style="font-size:12px;color:gray">Demo me OTP screen par hi show hoga (Free hai)</p>
<input id="otpInput" placeholder="6 Digit OTP likho" style="display:none">
<button id="verifyBtn" class="btn-green" style="display:none;background:#00a884" onclick="verifyOTP()">Verify OTP</button>
<p id="loginStatus"></p>
<button onclick="openSetting()" style="background:transparent;color:gray">⚙️ Setting</button>
</div>

<div id="incoming">
<h2>📞 Incoming Call...</h2>
<p id="callerText"></p>
<button class="btn-call" onclick="acceptCall()">✅ ACCEPT</button>
<button class="btn-end" onclick="rejectCall()">❌ REJECT</button>
</div>

<div id="mainApp" style="text-align:center">
<h3 style="color:#25D366">Wajid Calling App ✅</h3>
<p id="welcome"></p>
<input id="room" value="123" style="width:40%"><br><br>
<button id="callBtn" class="btn-call" onclick="makeCall()">📞 CALL</button>
<button id="endBtn" class="btn-end" onclick="endCall()" style="display:none">📵 END</button>
<br><br>
<video id="my" autoplay muted playsinline></video>
<video id="other" autoplay playsinline></video>
<p id="status">Not Connected</p>
<div style="text-align:center">
<button onclick="toggleMic()" id="micBtn" style="background:#2a3942;color:white">🎤 Mic</button>
<button onclick="toggleCam()" id="camBtn" style="background:#2a3942;color:white">📷 Cam</button>
<button onclick="shareScreen()" style="background:#2a3942;color:white">🖥️ Screen</button>
<button onclick="openSetting()" style="background:#2a3942;color:white">⚙️ Setting</button>
</div>

<div id="chatBox"></div>

<div style="padding:10px;text-align:center;background:#202c33;border-radius:15px;margin:10px">
<input type="file" id="fileInput" hidden onchange="sendFile(this)">
<button onclick="fileInput.click()" style="background:#2a3942;color:white">📷 Photo</button>
<button onclick="startVoice()" id="voiceBtn" style="background:#2a3942;color:white">🎤 Voice</button>
<input id="msgInput" placeholder="Message..." style="width:35%">
<button onclick="sendMsg()" style="background:#25D366;color:white">Send</button>
</div>
</div>

<!-- SETTING POPUP -->
<div id="settingBox" class="box" style="display:none;position:fixed;top:10%;left:50%;transform:translateX(-50%);z-index:1000;width:85%">
<h3>⚙️ Setting</h3>
<input id="setName" placeholder="Name Change"><br>
<button class="btn-green" onclick="saveSetting()">Save</button>
<button onclick="closeSetting()" style="background:#f15c6d;color:white;width:90%">Close</button>
</div>

<script>
let generatedOTP="";
let socket, pc, localStream, incomingRoom=null, micOn=true, camOn=true;
const servers={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"}]};

// LOGIN + 6 DIGIT OTP LOGIC
function sendOTP(){
  let name=document.getElementById('userName').value;
  let email=document.getElementById('userEmail').value;
  let phone=document.getElementById('userPhone').value;
  if(!name || !email || !phone){ alert('Naam, Gmail, Phone teeno likho'); return; }
  generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
  document.getElementById('loginStatus').innerText='OTP: '+generatedOTP+' (Ye apka code hai)';
  document.getElementById('otpInput').style.display='block';
  document.getElementById('verifyBtn').style.display='block';
  alert('Apka 6 Digit OTP hai: '+generatedOTP);
  localStorage.setItem('wajid_name', name);
  localStorage.setItem('wajid_email', email);
}
function verifyOTP(){
  let entered=document.getElementById('otpInput').value;
  if(entered==generatedOTP){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('mainApp').style.display='block';
    document.getElementById('welcome').innerText='Welcome '+localStorage.getItem('wajid_name')+' ✅';
    initSocket();
  } else { alert('Galat OTP! Sahi OTP: '+generatedOTP); }
}
function openSetting(){ document.getElementById('settingBox').style.display='block'; }
function closeSetting(){ document.getElementById('settingBox').style.display='none'; }
function saveSetting(){
  let n=document.getElementById('setName').value;
  if(n){ localStorage.setItem('wajid_name', n); document.getElementById('welcome').innerText='Welcome '+n+' ✅'; }
  closeSetting();
}

// CALLING LOGIC
function initSocket(){
  socket=io();
  socket.on('user-connected', async ()=>{
    let offer=await pc.createOffer(); await pc.setLocalDescription(offer);
    socket.emit('offer',{offer,roomId:document.getElementById('room').value});
  });
  socket.on('offer', async d=>{ await pc.setRemoteDescription(d.offer); let ans=await pc.createAnswer(); await pc.setLocalDescription(ans); socket.emit('answer',{answer:ans,roomId:d.roomId}); });
  socket.on('answer', async d=>{ await pc.setRemoteDescription(d.answer); });
  socket.on('ice-candidate', async d=>{ try{await pc.addIceCandidate(d.candidate)}catch(e){} });
  socket.on('incoming-call', d=>{ incomingRoom=d.roomId; document.getElementById('callerText').innerText='Room: '+d.roomId; document.getElementById('incoming').style.display='flex'; });
  socket.on('call-rejected', ()=>{ alert('Call Rejected'); endCall(); });
  socket.on('call-ended', ()=>{ endCall(); });
  socket.on('chat-message', d=>{ chatBox.innerHTML+=`<div class="msg">${d.text}</div><div style="clear:both"></div>`; chatBox.scrollTop=chatBox.scrollHeight; });
  socket.on('file-share', d=>{ if(d.type.startsWith('image')) chatBox.innerHTML+=`<div class="msg"><img src="${d.data}" style="max-width:140px;border-radius:10px"><br><a href="${d.data}" download="${d.name}" style="color:#25D366">Download</a></div><div style="clear:both"></div>`; else chatBox.innerHTML+=`<div class="msg">📁 ${d.name}<br><a href="${d.data}" download="${d.name}" style="color:#25D366">Download</a></div><div style="clear:both"></div>`; chatBox.scrollTop=chatBox.scrollHeight; });
  socket.on('voice-message', d=>{ chatBox.innerHTML+=`<div class="msg"><audio controls src="${d.data}"></audio></div><div style="clear:both"></div>`; chatBox.scrollTop=chatBox.scrollHeight; });
}
async function makeCall(){
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  document.getElementById('my').srcObject=localStream;
  let room=document.getElementById('room').value;
  document.getElementById('status').innerText='Calling...';
  document.getElementById('callBtn').style.display='none';
  document.getElementById('endBtn').style.display='inline-block';
  socket.emit('join-room', room);
  socket.emit('call-user', {roomId:room});
  createPC(room);
}
function createPC(room){
  pc=new RTCPeerConnection(servers);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{if(e.candidate) socket.emit('ice-candidate',{candidate:e.candidate,roomId:room})};
  pc.ontrack=e=>{document.getElementById('other').srcObject=e.streams[0]; document.getElementById('status').innerText='Connected ✅';};
}
async function acceptCall(){
  document.getElementById('incoming').style.display='none';
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  document.getElementById('my').srcObject=localStream;
  document.getElementById('room').value=incomingRoom;
  document.getElementById('status').innerText='Connected ✅';
  document.getElementById('callBtn').style.display='none';
  document.getElementById('endBtn').style.display='inline-block';
  socket.emit('join-room', incomingRoom);
  createPC(incomingRoom);
}
function rejectCall(){ document.getElementById('incoming').style.display='none'; socket.emit('call-rejected',{roomId:incomingRoom}); }
function endCall(){ if(pc) pc.close(); document.getElementById('other').srcObject=null; document.getElementById('callBtn').style.display='inline-block'; document.getElementById('endBtn').style.display='none'; document.getElementById('status').innerText='Call Ended'; socket.emit('end-call',{roomId:document.getElementById('room').value}); }
function sendMsg(){ let t=msgInput.value; if(!t) return; socket.emit('chat-message',{roomId:room.value,text:t}); msgInput.value=''; }
function sendFile(input){ let file=input.files[0]; let r=new FileReader(); r.onload=e=>{socket.emit('file-share',{roomId:room.value,name:file.name,data:e.target.result,type:file.type});}; r.readAsDataURL(file); }
let mediaRec, chunks=[]; function startVoice(){ if(mediaRec && mediaRec.state=='recording'){ mediaRec.stop(); voiceBtn.innerText='🎤 Voice'; return; } navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ mediaRec=new MediaRecorder(s); chunks=[]; mediaRec.ondataavailable=e=>chunks.push(e.data); mediaRec.onstop=()=>{ let blob=new Blob(chunks,{type:'audio/webm'}); let reader=new FileReader(); reader.onload=e=>{socket.emit('voice-message',{roomId:room.value,data:e.target.result});}; reader.readAsDataURL(blob); }; mediaRec.start(); voiceBtn.innerText='⏹️ Stop'; }); }
function toggleMic(){ micOn=!micOn; localStream.getAudioTracks()[0].enabled=micOn; micBtn.innerText=micOn?'🎤 Mic':'🔇 Mute'; }
function toggleCam(){ camOn=!camOn; localStream.getVideoTracks()[0].enabled=camOn; camBtn.innerText=camOn?'📷 Cam':'📷 Off'; }
function shareScreen(){ navigator.mediaDevices.getDisplayMedia({video:true}).then(s=>{ let track=s.getVideoTracks()[0]; pc.getSenders().find(x=>x.track.kind=='video').replaceTrack(track); my.srcObject=s; track.onended=()=>{ pc.getSenders().find(x=>x.track.kind=='video').replaceTrack(localStream.getVideoTracks()[0]); my.srcObject=localStream; } }); }
</script>
</body>
</html>
