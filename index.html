<!DOCTYPE html>
<html>
<head>
  <title>Wajid Calling App - Dubai to Pakistan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
    video { width: 45%; border: 2px solid #25D366; border-radius: 10px; margin: 5px; background: black; }
    button { padding: 12px 25px; font-size: 18px; background: #25D366; color: white; border: none; border-radius: 25px; margin: 10px; }
    input { padding: 10px; font-size: 16px; border-radius: 10px; border: 1px solid gray; }
  </style>
</head>
<body>
  <h2>Wajid Calling App 📞</h2>
  <p>Dubai se Pakistan FREE Calling</p>
  <input id="roomId" placeholder="Room ID likho (jaise 123)" />
  <button onclick="joinRoom()">Call Join Karo</button>
  <br><br>
  <video id="myVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>

<script>
  const socket = io();
  let localStream;
  let peerConnection;
  const config = {
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  };

  async function joinRoom() {
    const roomId = document.getElementById('roomId').value;
    if(!roomId) return alert('Room ID likho!');

    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('myVideo').srcObject = localStream;

    socket.emit('join-room', roomId);

    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.onicecandidate = e => {
      if(e.candidate) socket.emit('ice-candidate', { candidate: e.candidate, roomId });
    };
    peerConnection.ontrack = e => {
      document.getElementById('remoteVideo').srcObject = e.streams[0];
    };

    socket.on('user-connected', async () => {
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('offer', { offer, roomId });
    });

    socket.on('offer', async data => {
      await peerConnection.setRemoteDescription(data.offer);
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('answer', { answer, roomId });
    });

    socket.on('answer', async data => {
      await peerConnection.setRemoteDescription(data.answer);
    });

    socket.on('ice-candidate', async data => {
      await peerConnection.addIceCandidate(data.candidate);
    });
  }
</script>
</body>
</html>
